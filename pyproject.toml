[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vericart-agent"
version = "0.1.0"
description = "Long-horizon shopping Agent with DAPO-style Agentic RL"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["groundedvision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
