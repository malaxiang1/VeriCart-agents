# Matched GRPO/PAD-GRPO recipe for two 24 GiB RTX 3090 GPUs.
hydra:
  searchpath:
    - pkg://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  train_files: ${oc.env:GRPO_TRAIN_FILE}
  val_files: ${oc.env:GRPO_VAL_FILE}
  train_batch_size: 2
  val_batch_size: 2
  max_prompt_length: 2048
  max_response_length: 6144
  return_raw_chat: true
  filter_overlong_prompts: true
  truncation: error

actor_rollout_ref:
  model:
    path: ${oc.env:GRPO_MODEL_PATH}
    trust_remote_code: true
    enable_gradient_checkpointing: true
    use_remove_padding: true
    lora_rank: 8
    lora_alpha: 16
    target_modules: all-linear
    lora:
      merge: true
    override_config:
      attn_implementation: sdpa
  actor:
    ppo_mini_batch_size: 2
    ppo_micro_batch_size_per_gpu: 1
    ppo_max_token_len_per_gpu: 8192
    use_dynamic_bsz: false
    use_remove_padding: true
    freeze_vision_tower: true
    loss_agg_mode: token-mean
    clip_ratio_low: 0.20
    clip_ratio_high: 0.20
    entropy_coeff: 0.0
    calculate_entropy: false
    use_kl_loss: false
    kl_loss_coef: 0.0
    optim:
      lr: 1.0e-6
      lr_warmup_steps_ratio: 0.03
    fsdp_config:
      optimizer_offload: true
      param_offload: true
  rollout:
    name: vllm
    mode: async
    n: 4
    temperature: 0.7
    top_p: 0.9
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.30
    max_num_seqs: 4
    max_model_len: 8192
    max_num_batched_tokens: 8192
    free_cache_engine: true
    calculate_log_probs: true
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_max_token_len_per_gpu: 8192
    log_prob_use_dynamic_bsz: false
    agent:
      num_workers: 4
      default_agent_loop: shopping_tool_agent
      agent_loop_config_path: ${oc.env:SHOPPING_AGENT_LOOP_CONFIG}
    multi_turn:
      enable: true
      format: qwen3_coder
      max_user_turns: 35
      max_assistant_turns: 35
      max_parallel_calls: 1
      max_tool_response_length: 8192
      tool_response_truncate_side: middle
      tool_config_path: ${oc.env:SHOPPING_TOOL_CONFIG}
      tokenization_sanity_check_mode: ignore_strippable
    val_kwargs:
      n: 1
      temperature: 0.0
      top_p: 1.0
      do_sample: false
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_max_token_len_per_gpu: 8192
    log_prob_use_dynamic_bsz: false
    fsdp_config:
      param_offload: true

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  norm_adv_by_std_in_grpo: false
  rollout_correction:
    bypass_mode: true
    rollout_is: null
    rollout_rs: null
    loss_type: ppo_clip

# Native GRPO keeps this disabled. The DAPO launcher enables it explicitly:
# bounded resampling rejects all-equal/invalid groups before an optimizer update.
shopping_dynamic_sampling:
  enable: false
  selection_mode: whole
  metric: seq_reward
  max_num_gen_batches: 3
  max_consecutive_skipped_updates: 10
  reward_tolerance: 1.0e-8

pad_grpo:
  enable: false
  progress_lambda: 0.1
  confidence_margin: 0.05
  tolerance: 1.0e-8
  weights:
    match: 0.30
    evidence: 0.25
    option: 0.15
    price: 0.10
    correct_termination: 0.10
    efficiency: 0.05
    no_repeat: 0.05

reward_model:
  enable: false

event_credit:
  enable: false
  max_abs_event_reward: 0.10

shopping_hgpo:
  enable: false
  gamma: 0.95
  step_weight: 0.35
  history_length: 2
  epsilon: 1.0e-6

ray_kwargs:
  ray_init:
    runtime_env:
      worker_process_setup_hook: shopping_grpo.training.grpo.compat.install_torch_padding_fallback

trainer:
  total_epochs: 50
  total_training_steps: 300
  save_freq: 25
  test_freq: 25
  val_before_train: true
  logger: [console]
  project_name: groundedshop-rl
  experiment_name: shopping-grpo-2x3090
  default_local_dir: ${oc.env:GRPO_OUTPUT_DIR}
  n_gpus_per_node: 2
  nnodes: 1
